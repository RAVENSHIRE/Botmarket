# BOTMARKET local development stack.
#
#   docker compose up --build
#
# Services:
#   backend   - FastAPI API on :8000 (PostgreSQL-backed here)
#   frontend  - Next.js dashboard on :3000
#   database  - PostgreSQL 16
#   redis     - reserved for future queues / caching / pub-sub

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://botmarket:botmarket@database:5432/botmarket
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botmarket
      POSTGRES_PASSWORD: botmarket
      POSTGRES_DB: botmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botmarket"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
